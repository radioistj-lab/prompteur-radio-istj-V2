<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">

<title>Prompteur vocal</title>

<!--
  Prompteur vocal V4
  © 2026 C. Declerck
  Tous droits réservés.
-->

<style>

* { box-sizing: border-box; }

:root {
  --bg: #070b14;
  --panel: #101725;
  --panel2: #151e2f;
  --border: #273349;
  --text: #f3f6fb;
  --muted: #9aa8bc;
  --primary: #4f7cff;
  --primary-hover: #628aff;
  --green: #2fc77a;
  --orange: #f0a43c;
  --red: #e95d63;
  --current: #ffd84d;
  --read: #7c899d;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
  background: var(--bg);
  color: var(--text);
}

body { overflow: hidden; }

button,
textarea,
input {
  font: inherit;
}


/* =========================================================
   ÉCRAN DE PRÉPARATION
========================================================= */

#editorScreen {
  position: fixed;
  inset: 0;
  overflow-y: auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      #172544 0,
      #0b1220 32%,
      #070b14 70%
    );

  padding: 30px 22px;
}

.app {
  width: min(100%, 1050px);
  margin: 0 auto;
}

.brand {
  text-align: center;
  margin: 8px 0 25px;
}

.brandIcon {
  width: 66px;
  height: 66px;
  margin: 0 auto 12px;
  border-radius: 21px;
  display: grid;
  place-items: center;
  font-size: 32px;

  background:
    linear-gradient(
      145deg,
      #4f7cff,
      #6b55e8
    );

  box-shadow:
    0 14px 40px rgba(79,124,255,.25);
}

.brand h1 {
  margin: 0;
  font-size: clamp(30px,5vw,44px);
  letter-spacing: -.7px;
}

.brand p {
  margin: 7px 0 0;
  color: var(--muted);
  font-size: 15px;
}


/* =========================================================
   CARTES
========================================================= */

.editorCard,
.libraryCard {
  background: rgba(16,23,37,.92);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;

  box-shadow:
    0 22px 60px rgba(0,0,0,.3);
}

.editorTitle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.editorTitle strong {
  font-size: 17px;
}

#wordCount {
  color: var(--muted);
  font-size: 13px;
}


/* =========================================================
   TITRE
========================================================= */

#scriptTitle {
  width: 100%;
  height: 46px;
  margin-bottom: 12px;
  padding: 0 14px;

  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;

  background: #090f1b;
  color: #edf2fa;

  font-size: 15px;
}

#scriptTitle:focus,
#inputText:focus {
  border-color: #557fff;

  box-shadow:
    0 0 0 3px rgba(79,124,255,.12);
}

#scriptTitle::placeholder,
#inputText::placeholder {
  color: #65738a;
}


/* =========================================================
   TEXTE
========================================================= */

#inputText {
  display: block;
  width: 100%;
  min-height: 300px;
  resize: vertical;

  border: 1px solid var(--border);
  border-radius: 14px;
  outline: none;

  padding: 18px;

  background: #090f1b;
  color: #edf2fa;

  font-size: 18px;
  line-height: 1.55;
}


/* =========================================================
   COMMANDES ÉDITEUR
========================================================= */

.editorFooter {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;
  margin-top: 15px;
}

.hint {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}

.editorActions {
  display: flex;
  gap: 8px;
}

button {
  border: 0;
  cursor: pointer;
  user-select: none;

  transition:
    transform .12s,
    background .2s,
    opacity .2s;
}

button:active {
  transform: scale(.97);
}

#saveBtn {
  padding: 12px 16px;
  border-radius: 11px;

  background: #1d704c;
  color: #baf3d3;

  font-weight: 600;
  white-space: nowrap;
}

#saveBtn:hover {
  background: #25855b;
}

#launchBtn {
  padding: 12px 18px;
  border-radius: 11px;

  background: var(--primary);
  color: white;

  font-weight: 650;
  white-space: nowrap;

  box-shadow:
    0 9px 25px rgba(79,124,255,.25);
}

#launchBtn:hover {
  background: var(--primary-hover);
}


/* =========================================================
   MESSAGE SAUVEGARDE
========================================================= */

#saveMessage {
  min-height: 20px;
  margin-top: 9px;

  color: #83deb0;
  font-size: 12px;
  text-align: right;
}


/* =========================================================
   BIBLIOTHÈQUE
========================================================= */

.libraryCard {
  margin-top: 18px;
}

.libraryHeader {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 10px;
  margin-bottom: 14px;
}

.libraryHeader h2 {
  margin: 0;
  font-size: 18px;
}

.libraryHeader span {
  color: var(--muted);
  font-size: 12px;
}

#libraryEmpty {
  padding: 25px 10px;
  text-align: center;

  color: #738198;
  font-size: 14px;
}

.scriptItem {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 12px;

  border: 1px solid rgba(255,255,255,.07);
  border-radius: 12px;

  background: #0b111d;

  margin-bottom: 8px;
}

.scriptItem:last-child {
  margin-bottom: 0;
}

.scriptInfo {
  min-width: 0;
  flex: 1;
}

.scriptName {
  color: #edf2f8;
  font-weight: 600;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.scriptMeta {
  margin-top: 4px;
  color: #77859a;
  font-size: 11px;
}

.scriptButtons {
  display: flex;
  gap: 6px;
}

.openButton,
.deleteButton {
  height: 34px;
  padding: 0 11px;
  border-radius: 8px;

  font-size: 12px;
}

.openButton {
  background: #203458;
  color: #aec7ff;
}

.deleteButton {
  background: #47252a;
  color: #ff9da2;
}


/* =========================================================
   COPYRIGHT
========================================================= */

.copyright {
  text-align: center;
  margin: 21px 0 10px;

  color: #65738a;
  font-size: 12px;
}


/* =========================================================
   LECTEUR
========================================================= */

#readerScreen {
  display: none;
  position: fixed;
  inset: 0;

  background: #030508;
  overflow: hidden;
}


/* =========================================================
   BARRE DE COMMANDES
========================================================= */

#readerToolbar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 58px;
  z-index: 100;

  display: flex;
  align-items: center;

  gap: 7px;
  padding: 7px 12px;

  background: rgba(12,17,27,.96);

  border-bottom:
    1px solid rgba(255,255,255,.07);

  backdrop-filter: blur(10px);
}

.toolbarTitle {
  font-weight: 650;
  font-size: 15px;

  margin-right: auto;

  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.toolbarButton {
  height: 38px;
  padding: 0 12px;

  border-radius: 9px;

  background: #1b2535;
  color: #dce4f0;

  font-size: 13px;
}

.toolbarButton:hover {
  background: #263349;
}

#pauseBtn {
  background: #49351d;
  color: #ffc96e;
}

#resetBtn {
  background: #47252a;
  color: #ff9da2;
}

#editBtn {
  background: #203458;
  color: #a9c3ff;
}

#mirrorBtn.active {
  background: #4b3d17;
  color: #ffe27a;
}


/* =========================================================
   TAILLE
========================================================= */

.fontControl {
  display: flex;
  align-items: center;

  height: 38px;

  background: #151e2c;
  border-radius: 9px;

  overflow: hidden;
}

.fontButton {
  width: 42px;
  height: 38px;

  background: transparent;
  color: #e7edf7;

  font-weight: 650;
}

.fontButton:hover {
  background: #263349;
}

#fontLabel {
  min-width: 42px;
  text-align: center;

  color: #aeb9ca;
  font-size: 12px;
}


/* =========================================================
   ÉTAT MICRO
========================================================= */

#status {
  position: absolute;

  top: 70px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 50;

  display: flex;
  align-items: center;
  gap: 7px;

  padding: 6px 12px;

  border-radius: 20px;

  background: rgba(14,20,31,.88);

  border:
    1px solid rgba(255,255,255,.08);

  color: #aeb9ca;
  font-size: 12px;

  pointer-events: none;
}

.statusDot {
  width: 7px;
  height: 7px;

  border-radius: 50%;
  background: #7b8799;
}

#status.listening {
  color: #9ae6bd;
}

#status.listening .statusDot {
  background: var(--green);

  box-shadow:
    0 0 9px rgba(47,199,122,.7);
}


/* =========================================================
   PROMPTEUR
========================================================= */

#prompter {
  position: absolute;

  top: 58px;
  left: 0;
  right: 0;
  bottom: 0;

  overflow-y: auto;

  scrollbar-width: none;
  overscroll-behavior: none;
}

#prompter::-webkit-scrollbar {
  display: none;
}

#text {
  max-width: 1120px;
  margin: 0 auto;

  padding:
    35vh
    6%
    55vh;

  font-size: 46px;
  line-height: 1.52;

  text-align: center;

  overflow-wrap: break-word;

  transform: scaleX(1);
  transform-origin: center center;
}

#text.mirrored {
  transform: scaleX(-1);
}

.word {
  display: inline;
  color: #edf2f7;

  transition:
    color .16s;
}

.word.read {
  color: var(--read);
}

.word.current {
  color: var(--current);

  text-shadow:
    0 0 15px rgba(255,216,77,.12);
}


/* =========================================================
   GUIDE
========================================================= */

#focusGuide {
  position: absolute;

  z-index: 5;

  left: 8%;
  right: 8%;

  top: 43%;

  height: 1px;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.055),
      transparent
    );
}


/* =========================================================
   COMPTE À REBOURS
========================================================= */

#countdown {
  display: none;

  position: fixed;
  inset: 0;

  z-index: 1000;

  place-items: center;

  background: rgba(3,5,8,.94);

  font-size:
    clamp(100px,22vw,220px);

  font-weight: 750;

  color: white;
}

#countdown.show {
  display: grid;
}

#countNumber {
  animation:
    countPulse .65s ease;
}

@keyframes countPulse {

  0% {
    transform: scale(.75);
    opacity: 0;
  }

  35% {
    transform: scale(1);
    opacity: 1;
  }

  100% {
    transform: scale(.94);
    opacity: .85;
  }
}


/* =========================================================
   TABLETTE
========================================================= */

@media (max-width: 800px) {

  #editorScreen {
    padding: 20px 13px;
  }

  .brand {
    margin-bottom: 18px;
  }

  .brandIcon {
    width: 55px;
    height: 55px;

    border-radius: 17px;

    font-size: 27px;
  }

  .brand h1 {
    font-size: 29px;
  }

  .editorCard,
  .libraryCard {
    padding: 14px;
  }

  #inputText {
    min-height: 260px;
    font-size: 16px;
  }

  #readerToolbar {
    height: 52px;

    padding: 6px 7px;
    gap: 4px;
  }

  .toolbarTitle {
    font-size: 13px;
  }

  .toolbarButton {
    height: 36px;

    padding: 0 8px;

    font-size: 11px;
  }

  .fontControl,
  .fontButton {
    height: 36px;
  }

  #prompter {
    top: 52px;
  }

  #status {
    top: 62px;
  }

  #text {
    font-size: 30px;

    padding-left: 4%;
    padding-right: 4%;
  }
}


/* =========================================================
   TÉLÉPHONE
========================================================= */

@media (max-width: 560px) {

  #editorScreen {
    padding: 13px 9px;
  }

  .brand {
    margin: 2px 0 14px;
  }

  .brandIcon {
    width: 47px;
    height: 47px;

    border-radius: 14px;

    font-size: 22px;

    margin-bottom: 7px;
  }

  .brand h1 {
    font-size: 25px;
  }

  .brand p {
    font-size: 13px;
  }

  .editorCard,
  .libraryCard {
    border-radius: 15px;
    padding: 11px;
  }

  #inputText {
    min-height: 230px;
    font-size: 15px;
    padding: 13px;
  }

  .editorFooter {
    flex-direction: column;
    align-items: stretch;
  }

  .editorActions {
    display: grid;
    grid-template-columns: 1fr 1.35fr;
  }

  .hint {
    text-align: center;
  }

  .scriptItem {
    align-items: flex-start;
  }

  .scriptButtons {
    flex-direction: column;
  }

  .toolbarTitle {
    display: none;
  }

  #readerToolbar {
    justify-content: center;
  }

  .toolbarButton {
    padding: 0 5px;
    font-size: 10px;
  }

  .fontButton {
    width: 31px;
  }

  #fontLabel {
    display: none;
  }

  #fullscreenBtn {
    width: 34px;
    padding: 0;
  }

  #mirrorBtn {
    padding: 0 6px;
  }

  #text {
    font-size: 24px;
    line-height: 1.45;

    padding-left: 3.5%;
    padding-right: 3.5%;
  }

  #status {
    font-size: 10px;
    padding: 5px 9px;
  }
}

</style>
</head>


<body>


<!-- =======================================================
     PRÉPARATION
======================================================= -->

<section id="editorScreen">

  <div class="app">

    <div class="brand">

      <div class="brandIcon">
        🎙️
      </div>

      <h1>Prompteur vocal</h1>

      <p>
        Votre texte suit naturellement votre voix.
      </p>

    </div>


    <div class="editorCard">

      <div class="editorTitle">

        <strong>
          Préparer un texte
        </strong>

        <span id="wordCount">
          0 mot
        </span>

      </div>


      <input
        id="scriptTitle"
        type="text"
        maxlength="80"
        placeholder="Titre de la chronique"
      >


      <textarea
        id="inputText"
        placeholder="Collez ou écrivez ici le texte à lire..."
      ></textarea>


      <div class="editorFooter">

        <div class="hint">
          Vous pouvez enregistrer cette chronique
          sur cet appareil pour la retrouver plus tard.
        </div>


        <div class="editorActions">

          <button id="saveBtn">
            💾 Enregistrer
          </button>

          <button id="launchBtn">
            🎙️ Lancer le prompteur
          </button>

        </div>

      </div>


      <div id="saveMessage"></div>

    </div>


    <!-- ===================================================
         BIBLIOTHÈQUE
    =================================================== -->

    <div class="libraryCard">

      <div class="libraryHeader">

        <h2>
          📚 Mes textes
        </h2>

        <span>
          Enregistrés sur cet appareil
        </span>

      </div>


      <div id="libraryList"></div>

    </div>


    <div class="copyright">
      © 2026 C. Declerck — Tous droits réservés.
    </div>

  </div>

</section>



<!-- =======================================================
     LECTEUR
======================================================= -->

<section id="readerScreen">


  <div id="readerToolbar">

    <div
      id="readerTitle"
      class="toolbarTitle"
    >
      Prompteur vocal
    </div>


    <button
      id="pauseBtn"
      class="toolbarButton"
    >
      ⏸ Pause
    </button>


    <button
      id="resetBtn"
      class="toolbarButton"
    >
      ↩ Début
    </button>


    <button
      id="editBtn"
      class="toolbarButton"
    >
      ✏️ Modifier
    </button>


    <div class="fontControl">

      <button
        id="fontMinus"
        class="fontButton"
        title="Réduire le texte"
      >
        A−
      </button>

      <span id="fontLabel">
        46
      </span>

      <button
        id="fontPlus"
        class="fontButton"
        title="Agrandir le texte"
      >
        A+
      </button>

    </div>


    <button
      id="mirrorBtn"
      class="toolbarButton"
      title="Activer le mode miroir"
    >
      🪞 Miroir
    </button>


    <button
      id="fullscreenBtn"
      class="toolbarButton"
      title="Plein écran"
    >
      ⛶
    </button>

  </div>


  <div id="status">

    <span class="statusDot"></span>

    <span id="statusText">
      Prêt
    </span>

  </div>


  <div id="focusGuide"></div>


  <div id="prompter">

    <div id="text"></div>

  </div>

</section>



<!-- =======================================================
     COMPTE À REBOURS
======================================================= -->

<div id="countdown">

  <div id="countNumber">
    3
  </div>

</div>



<script>

/* =========================================================
   ÉLÉMENTS
========================================================= */

const editorScreen =
  document.getElementById("editorScreen");

const readerScreen =
  document.getElementById("readerScreen");

const scriptTitle =
  document.getElementById("scriptTitle");

const inputText =
  document.getElementById("inputText");

const wordCount =
  document.getElementById("wordCount");

const saveBtn =
  document.getElementById("saveBtn");

const saveMessage =
  document.getElementById("saveMessage");

const libraryList =
  document.getElementById("libraryList");

const launchBtn =
  document.getElementById("launchBtn");

const readerTitle =
  document.getElementById("readerTitle");

const text =
  document.getElementById("text");

const prompter =
  document.getElementById("prompter");

const statusBox =
  document.getElementById("status");

const statusText =
  document.getElementById("statusText");

const pauseBtn =
  document.getElementById("pauseBtn");

const resetBtn =
  document.getElementById("resetBtn");

const editBtn =
  document.getElementById("editBtn");

const mirrorBtn =
  document.getElementById("mirrorBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const fontMinus =
  document.getElementById("fontMinus");

const fontPlus =
  document.getElementById("fontPlus");

const fontLabel =
  document.getElementById("fontLabel");

const countdown =
  document.getElementById("countdown");

const countNumber =
  document.getElementById("countNumber");


/* =========================================================
   VARIABLES
========================================================= */

let words = [];
let currentWord = 0;

let recognition = null;
let listening = false;

let voiceActive = false;

let lastVoiceActivity = 0;

let previousFrameTime = 0;

let targetScrollSpeed = 0;
let currentScrollSpeed = 0;

let estimatedReadingSpeed = 24;

let previousTrackedWord = 0;
let previousTrackedTime = 0;

let currentFontSize = 46;

let mirrorMode = false;

let countdownRunning = false;

let currentSavedId = null;


/* =========================================================
   PARAMÈTRES DU MOTEUR V3
========================================================= */

const SILENCE_DELAY = 950;

const SPEED_SMOOTHING = 0.055;

const MAX_CORRECTION_PER_FRAME = 1.2;


/* =========================================================
   STOCKAGE LOCAL
========================================================= */

const STORAGE_KEY =
  "prompteur_vocal_scripts_v4";


function getSavedScripts() {

  try {

    const data =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!data) {
      return [];
    }

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  }

  catch (error) {

    return [];
  }
}


function storeScripts(scripts) {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(scripts)
  );
}


/* =========================================================
   BIBLIOTHÈQUE
========================================================= */

function renderLibrary() {

  const scripts =
    getSavedScripts();

  libraryList.innerHTML = "";


  if (!scripts.length) {

    const empty =
      document.createElement("div");

    empty.id =
      "libraryEmpty";

    empty.textContent =
      "Aucun texte enregistré pour le moment.";

    libraryList.appendChild(
      empty
    );

    return;
  }


  scripts
    .sort(
      (a,b) =>
        b.updatedAt -
        a.updatedAt
    )
    .forEach(
      script => {

        const item =
          document.createElement(
            "div"
          );

        item.className =
          "scriptItem";


        const info =
          document.createElement(
            "div"
          );

        info.className =
          "scriptInfo";


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "scriptName";

        name.textContent =
          script.title;


        const meta =
          document.createElement(
            "div"
          );

        meta.className =
          "scriptMeta";


        const totalWords =
          script.text
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .length;


        const date =
          new Date(
            script.updatedAt
          );


        meta.textContent =
          totalWords +
          (totalWords > 1
            ? " mots"
            : " mot") +
          " • " +
          date.toLocaleDateString(
            "fr-FR"
          );


        info.appendChild(name);
        info.appendChild(meta);


        const buttons =
          document.createElement(
            "div"
          );

        buttons.className =
          "scriptButtons";


        const open =
          document.createElement(
            "button"
          );

        open.className =
          "openButton";

        open.textContent =
          "Ouvrir";


        open.addEventListener(
          "click",
          () => {

            scriptTitle.value =
              script.title;

            inputText.value =
              script.text;

            currentSavedId =
              script.id;

            updateWordCount();

            saveMessage.textContent =
              "Texte chargé.";

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          }
        );


        const remove =
          document.createElement(
            "button"
          );

        remove.className =
          "deleteButton";

        remove.textContent =
          "Supprimer";


        remove.addEventListener(
          "click",
          () => {

            const confirmed =
              confirm(
                'Supprimer "' +
                script.title +
                '" ?'
              );

            if (!confirmed) {
              return;
            }


            const remaining =
              getSavedScripts()
                .filter(
                  item =>
                    item.id !==
                    script.id
                );


            storeScripts(
              remaining
            );


            if (
              currentSavedId ===
              script.id
            ) {

              currentSavedId =
                null;
            }


            renderLibrary();

            saveMessage.textContent =
              "Texte supprimé.";
          }
        );


        buttons.appendChild(open);
        buttons.appendChild(remove);


        item.appendChild(info);
        item.appendChild(buttons);


        libraryList.appendChild(
          item
        );
      }
    );
}


/* =========================================================
   ENREGISTRER
========================================================= */

saveBtn.addEventListener(
  "click",
  () => {

    const title =
      scriptTitle.value.trim();

    const content =
      inputText.value.trim();


    if (!content) {

      alert(
        "Écrivez ou collez d'abord un texte."
      );

      return;
    }


    if (!title) {

      alert(
        "Donnez un titre à cette chronique."
      );

      scriptTitle.focus();

      return;
    }


    const scripts =
      getSavedScripts();

    const now =
      Date.now();


    if (currentSavedId) {

      const existing =
        scripts.find(
          item =>
            item.id ===
            currentSavedId
        );


      if (existing) {

        existing.title =
          title;

        existing.text =
          content;

        existing.updatedAt =
          now;

      }

      else {

        currentSavedId =
          null;
      }
    }


    if (!currentSavedId) {

      const newScript = {

        id:
          "script_" +
          now +
          "_" +
          Math.random()
            .toString(36)
            .slice(2,8),

        title:
          title,

        text:
          content,

        createdAt:
          now,

        updatedAt:
          now
      };


      scripts.push(
        newScript
      );


      currentSavedId =
        newScript.id;
    }


    try {

      storeScripts(
        scripts
      );

      renderLibrary();

      saveMessage.textContent =
        "✓ Texte enregistré sur cet appareil.";

    }

    catch (error) {

      alert(
        "Impossible d'enregistrer le texte sur cet appareil."
      );
    }
  }
);


/* =========================================================
   COMPTEUR
========================================================= */

function updateWordCount() {

  const value =
    inputText.value.trim();

  const total =
    value
      ? value.split(/\s+/).length
      : 0;

  wordCount.textContent =
    total +
    (total > 1
      ? " mots"
      : " mot");
}


inputText.addEventListener(
  "input",
  () => {

    updateWordCount();

    saveMessage.textContent = "";
  }
);


scriptTitle.addEventListener(
  "input",
  () => {

    saveMessage.textContent = "";
  }
);


/* =========================================================
   NORMALISATION
========================================================= */

function normalizeWord(value) {

  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^\p{L}\p{N}]/gu,
      ""
    );
}


/* =========================================================
   CONSTRUCTION TEXTE
========================================================= */

function buildText() {

  const content =
    inputText.value.trim();


  if (!content) {
    return false;
  }


  text.innerHTML = "";


  const rawWords =
    content.split(/\s+/);


  words =
    rawWords.map(
      (rawWord,index) => {

        const span =
          document.createElement(
            "span"
          );

        span.className =
          "word";

        span.dataset.index =
          index;

        span.textContent =
          rawWord + " ";

        text.appendChild(
          span
        );


        return {

          original:
            rawWord,

          normalized:
            normalizeWord(
              rawWord
            ),

          element:
            span
        };
      }
    );


  currentWord = 0;

  previousTrackedWord = 0;

  previousTrackedTime =
    performance.now();

  targetScrollSpeed = 0;

  currentScrollSpeed = 0;


  updateDisplay(true);


  return true;
}


/* =========================================================
   AFFICHAGE
========================================================= */

function updateDisplay(
  forcePosition = false
) {

  if (!words.length) {
    return;
  }


  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const element =
      words[i].element;


    element.classList.remove(
      "read",
      "current"
    );


    if (i < currentWord) {

      element.classList.add(
        "read"
      );
    }


    if (i === currentWord) {

      element.classList.add(
        "current"
      );
    }
  }


  if (forcePosition) {

    positionImmediately();
  }
}


/* =========================================================
   POSITION
========================================================= */

function positionImmediately() {

  const item =
    words[currentWord];


  if (!item) {
    return;
  }


  const desired =
    prompter.clientHeight *
    0.43;


  const target =
    Math.max(
      0,
      item.element.offsetTop -
      desired
    );


  prompter.scrollTop =
    target;
}


/* =========================================================
   ESTIMATION RYTHME
========================================================= */

function updateReadingSpeed() {

  const now =
    performance.now();


  const elapsed =
    now -
    previousTrackedTime;


  const wordDifference =
    currentWord -
    previousTrackedWord;


  if (
    wordDifference >= 2 &&
    elapsed >= 250
  ) {

    const wordsPerSecond =
      wordDifference /
      (elapsed / 1000);


    if (
      wordsPerSecond > 0.7 &&
      wordsPerSecond < 6
    ) {

      const calculatedSpeed =
        wordsPerSecond * 13;


      estimatedReadingSpeed =
        estimatedReadingSpeed *
        0.75 +
        calculatedSpeed *
        0.25;
    }


    previousTrackedWord =
      currentWord;


    previousTrackedTime =
      now;
  }
}


/* =========================================================
   ACTIVITÉ VOCALE
========================================================= */

function markVoiceActivity() {

  voiceActive = true;


  lastVoiceActivity =
    performance.now();


  targetScrollSpeed =
    estimatedReadingSpeed;
}


/* =========================================================
   DÉFILEMENT HYBRIDE
========================================================= */

function hybridScrollLoop(time) {

  if (!previousFrameTime) {

    previousFrameTime =
      time;
  }


  const delta =
    Math.min(
      50,
      time -
      previousFrameTime
    );


  previousFrameTime =
    time;


  if (listening) {

    const silenceDuration =
      performance.now() -
      lastVoiceActivity;


    if (
      silenceDuration >
      SILENCE_DELAY
    ) {

      voiceActive =
        false;


      targetScrollSpeed =
        0;
    }


    currentScrollSpeed +=
      (
        targetScrollSpeed -
        currentScrollSpeed
      ) *
      SPEED_SMOOTHING;


    if (
      !voiceActive &&
      Math.abs(
        currentScrollSpeed
      ) < 0.15
    ) {

      currentScrollSpeed =
        0;
    }


    const movement =
      currentScrollSpeed *
      (delta / 1000);


    prompter.scrollTop +=
      movement;


    const item =
      words[currentWord];


    if (item) {

      const desiredPosition =
        prompter.clientHeight *
        0.43;


      const actualPosition =
        item.element.offsetTop -
        prompter.scrollTop;


      const difference =
        actualPosition -
        desiredPosition;


      const deadZone =
        prompter.clientHeight *
        0.12;


      if (
        Math.abs(difference) >
        deadZone
      ) {

        let correction =
          difference *
          0.012;


        correction =
          Math.max(
            -MAX_CORRECTION_PER_FRAME,
            Math.min(
              MAX_CORRECTION_PER_FRAME,
              correction
            )
          );


        prompter.scrollTop +=
          correction;
      }
    }
  }


  requestAnimationFrame(
    hybridScrollLoop
  );
}


/* =========================================================
   RECHERCHE POSITION
========================================================= */

function findBestPosition(
  spokenWords
) {

  if (
    !spokenWords.length ||
    !words.length
  ) {

    return null;
  }


  const recentSpoken =
    spokenWords.slice(-6);


  const localStart =
    Math.max(
      0,
      currentWord - 4
    );


  const localEnd =
    Math.min(
      words.length - 1,
      currentWord + 8
    );


  let bestPosition =
    null;


  let bestScore =
    0;


  for (
    let candidate =
      localStart;

    candidate <=
      localEnd;

    candidate++
  ) {

    let score = 0;


    for (
      let offset = 0;

      offset <
        recentSpoken.length;

      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];


      const textIndex =
        candidate -
        offset;


      if (
        textIndex < 0
      ) {

        continue;
      }


      if (
        words[textIndex] &&
        words[textIndex]
          .normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score > bestScore &&
      (
        score >= 2 ||
        (
          currentWord < 3 &&
          score >= 1
        )
      )
    ) {

      bestScore =
        score;


      bestPosition =
        candidate;
    }
  }


  if (
    bestPosition !==
    null
  ) {

    return {

      position:
        bestPosition,

      jump:
        false
    };
  }


  /* ---------- RATTRAPAGE ---------- */


  const recoveryStart =
    currentWord + 9;


  const recoveryEnd =
    Math.min(
      words.length - 1,
      currentWord + 60
    );


  let recoveryPosition =
    null;


  let recoveryScore =
    0;


  for (
    let candidate =
      recoveryStart;

    candidate <=
      recoveryEnd;

    candidate++
  ) {

    let score = 0;


    for (
      let offset = 0;

      offset <
        recentSpoken.length;

      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];


      const textIndex =
        candidate -
        offset;


      if (
        textIndex <
        recoveryStart
      ) {

        continue;
      }


      if (
        words[textIndex] &&
        words[textIndex]
          .normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score >= 3 &&
      score >
        recoveryScore
    ) {

      recoveryScore =
        score;


      recoveryPosition =
        candidate;
    }
  }


  if (
    recoveryPosition !==
    null
  ) {

    return {

      position:
        recoveryPosition,

      jump:
        true
    };
  }


  return null;
}


/* =========================================================
   RECONNAISSANCE VOCALE
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();


  recognition.lang =
    "fr-FR";


  recognition.continuous =
    true;


  recognition.interimResults =
    true;


  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;

      voiceActive =
        false;


      lastVoiceActivity =
        performance.now();


      targetScrollSpeed =
        0;


      statusText.textContent =
        "Écoute en cours";


      statusBox.classList.add(
        "listening"
      );


      pauseBtn.textContent =
        "⏸ Pause";
    };


  recognition.onresult =
    event => {

      let transcript = "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript +
          " ";
      }


      const spokenWords =
        transcript
          .trim()
          .split(/\s+/)
          .map(
            normalizeWord
          )
          .filter(
            Boolean
          );


      if (
        !spokenWords.length
      ) {

        return;
      }


      markVoiceActivity();


      const match =
        findBestPosition(
          spokenWords
        );


      if (
        match === null
      ) {

        return;
      }


      let newPosition;


      if (match.jump) {

        newPosition =
          match.position +
          1;

      }

      else {

        const maximumAdvance =
          4;


        newPosition =
          Math.min(
            match.position +
            1,

            currentWord +
            maximumAdvance
          );


        newPosition =
          Math.max(
            currentWord -
            2,

            newPosition
          );
      }


      newPosition =
        Math.max(
          0,

          Math.min(
            words.length -
            1,

            newPosition
          )
        );


      if (
        newPosition !==
        currentWord
      ) {

        currentWord =
          newPosition;


        updateReadingSpeed();


        updateDisplay(false);


        if (match.jump) {

          currentScrollSpeed =
            Math.max(
              currentScrollSpeed,
              estimatedReadingSpeed
            );
        }
      }
    };


  recognition.onerror =
    event => {

      if (
        event.error ===
        "no-speech"
      ) {

        return;
      }


      statusText.textContent =
        "Micro : " +
        event.error;
    };


  recognition.onend =
    () => {

      if (listening) {

        setTimeout(
          () => {

            if (!listening) {

              return;
            }


            try {

              recognition.start();

            }

            catch (e) {}

          },

          700
        );
      }

      else {

        voiceActive =
          false;


        targetScrollSpeed =
          0;


        statusText.textContent =
          "En pause";


        statusBox.classList.remove(
          "listening"
        );


        pauseBtn.textContent =
          "▶ Reprendre";
      }
    };
}


/* =========================================================
   DÉMARRER MICRO
========================================================= */

function startRecognition() {

  if (!SpeechRecognition) {

    alert(
      "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
    );

    return;
  }


  listening =
    true;


  voiceActive =
    false;


  targetScrollSpeed =
    0;


  previousTrackedWord =
    currentWord;


  previousTrackedTime =
    performance.now();


  try {

    recognition.start();

  }

  catch (e) {}
}


/* =========================================================
   COMPTE À REBOURS
========================================================= */

async function runCountdown() {

  if (countdownRunning) {

    return;
  }


  countdownRunning =
    true;


  countdown.classList.add(
    "show"
  );


  for (
    const number of
    ["3","2","1"]
  ) {

    countNumber.textContent =
      number;


    countNumber.style.animation =
      "none";


    void countNumber.offsetWidth;


    countNumber.style.animation =
      "countPulse .65s ease";


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          750
        )
    );
  }


  countdown.classList.remove(
    "show"
  );


  countdownRunning =
    false;


  startRecognition();
}


/* =========================================================
   LANCER
========================================================= */

launchBtn.addEventListener(
  "click",
  () => {

    if (!SpeechRecognition) {

      alert(
        "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
      );

      return;
    }


    if (!buildText()) {

      alert(
        "Écrivez ou collez d'abord un texte."
      );

      return;
    }


    const title =
      scriptTitle.value.trim();


    readerTitle.textContent =
      title ||
      "Prompteur vocal";


    editorScreen.style.display =
      "none";


    readerScreen.style.display =
      "block";


    requestAnimationFrame(
      () => {

        prompter.scrollTop =
          0;


        updateDisplay(true);


        runCountdown();
      }
    );
  }
);


/* =========================================================
   PAUSE / REPRISE
========================================================= */

pauseBtn.addEventListener(
  "click",
  () => {

    if (listening) {

      listening =
        false;


      voiceActive =
        false;


      targetScrollSpeed =
        0;


      if (recognition) {

        try {

          recognition.stop();

        }

        catch (e) {}
      }


      statusText.textContent =
        "En pause";


      statusBox.classList.remove(
        "listening"
      );


      pauseBtn.textContent =
        "▶ Reprendre";

    }

    else {

      startRecognition();


      pauseBtn.textContent =
        "⏸ Pause";
    }
  }
);


/* =========================================================
   RETOUR AU DÉBUT
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    currentWord =
      0;


    previousTrackedWord =
      0;


    previousTrackedTime =
      performance.now();


    targetScrollSpeed =
      0;


    currentScrollSpeed =
      0;


    prompter.scrollTop =
      0;


    updateDisplay(true);


    statusText.textContent =
      listening
      ? "Écoute en cours"
      : "Au début";
  }
);


/* =========================================================
   MODIFIER
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    listening =
      false;


    voiceActive =
      false;


    targetScrollSpeed =
      0;


    currentScrollSpeed =
      0;


    if (recognition) {

      try {

        recognition.stop();

      }

      catch (e) {}
    }


    readerScreen.style.display =
      "none";


    editorScreen.style.display =
      "block";
  }
);


/* =========================================================
   TAILLE
========================================================= */

function applyFontSize() {

  currentFontSize =
    Math.max(
      20,
      Math.min(
        70,
        currentFontSize
      )
    );


  text.style.fontSize =
    currentFontSize +
    "px";


  fontLabel.textContent =
    currentFontSize;
}


fontMinus.addEventListener(
  "click",
  () => {

    currentFontSize -= 2;

    applyFontSize();
  }
);


fontPlus.addEventListener(
  "click",
  () => {

    currentFontSize += 2;

    applyFontSize();
  }
);


/* =========================================================
   MODE MIROIR
========================================================= */

function applyMirrorMode() {

  if (mirrorMode) {

    text.classList.add(
      "mirrored"
    );


    mirrorBtn.classList.add(
      "active"
    );


    mirrorBtn.textContent =
      "🪞 Normal";


    mirrorBtn.title =
      "Désactiver le mode miroir";

  }

  else {

    text.classList.remove(
      "mirrored"
    );


    mirrorBtn.classList.remove(
      "active"
    );


    mirrorBtn.textContent =
      "🪞 Miroir";


    mirrorBtn.title =
      "Activer le mode miroir";
  }
}


mirrorBtn.addEventListener(
  "click",
  () => {

    mirrorMode =
      !mirrorMode;


    applyMirrorMode();
  }
);


/* =========================================================
   PLEIN ÉCRAN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        await document
          .documentElement
          .requestFullscreen();

      }

      else {

        await document
          .exitFullscreen();
      }

    }

    catch (e) {}
  }
);


/* =========================================================
   INITIALISATION
========================================================= */

updateWordCount();

applyFontSize();

applyMirrorMode();

renderLibrary();

requestAnimationFrame(
  hybridScrollLoop
);

</script>
