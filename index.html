<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">

<title>Prompteur vocal</title>

<!--

-->

<style>

* {
  box-sizing: border-box;
}

:root {
  --bg: #070b14;
  --panel: #101725;
  --panel2: #151e2f;
  --border: #273349;

  --text: #f3f6fb;
  --muted: #9aa8bc;

  --primary: #4f7cff;
  --primary-hover: #628aff;

  --green: #2fc77a;
  --orange: #f0a43c;
  --red: #e95d63;

  --current: #ffd84d;
  --read: #7c899d;
}


/* =========================================================
   BASE
========================================================= */

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;

  background: var(--bg);
  color: var(--text);
}

body {
  overflow: hidden;
}

button,
textarea {
  font: inherit;
}


/* =========================================================
   ÉCRAN DE PRÉPARATION
========================================================= */

#editorScreen {
  position: fixed;
  inset: 0;
  overflow-y: auto;

  background:
    radial-gradient(
      circle at 50% -10%,
      #172544 0,
      #0b1220 32%,
      #070b14 70%
    );

  padding: 35px 22px;
}

.app {
  width: min(100%, 1050px);
  margin: 0 auto;
}


/* ---------- TITRE ---------- */

.brand {
  text-align: center;
  margin: 12px 0 30px;
}

.brandIcon {
  width: 70px;
  height: 70px;

  margin: 0 auto 14px;

  border-radius: 22px;

  display: grid;
  place-items: center;

  font-size: 34px;

  background:
    linear-gradient(
      145deg,
      #4f7cff,
      #6b55e8
    );

  box-shadow:
    0 14px 40px rgba(79,124,255,.25);
}

.brand h1 {
  margin: 0;
  font-size: clamp(30px, 5vw, 44px);
  letter-spacing: -.7px;
}

.brand p {
  margin: 8px 0 0;
  color: var(--muted);
  font-size: 16px;
}


/* ---------- CARTE ---------- */

.editorCard {
  background: rgba(16,23,37,.92);

  border: 1px solid var(--border);

  border-radius: 20px;

  padding: 20px;

  box-shadow:
    0 22px 60px rgba(0,0,0,.3);
}

.editorTitle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  margin-bottom: 12px;
}

.editorTitle strong {
  font-size: 17px;
}

.editorTitle span {
  color: var(--muted);
  font-size: 13px;
}


/* ---------- TEXTAREA ---------- */

#inputText {
  display: block;

  width: 100%;
  min-height: 330px;

  resize: vertical;

  border:
    1px solid var(--border);

  border-radius: 14px;

  outline: none;

  padding: 18px;

  background: #090f1b;

  color: #edf2fa;

  font-size: 18px;
  line-height: 1.55;

  transition:
    border-color .2s,
    box-shadow .2s;
}

#inputText:focus {
  border-color: #557fff;

  box-shadow:
    0 0 0 3px rgba(79,124,255,.12);
}

#inputText::placeholder {
  color: #65738a;
}


/* ---------- BAS DE CARTE ---------- */

.editorFooter {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;

  margin-top: 16px;
}

.hint {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}


/* =========================================================
   BOUTONS
========================================================= */

button {
  border: 0;
  cursor: pointer;
  user-select: none;

  transition:
    transform .12s,
    background .2s,
    opacity .2s;
}

button:active {
  transform: scale(.97);
}

#launchBtn {
  min-width: 205px;

  padding: 13px 20px;

  border-radius: 12px;

  background: var(--primary);
  color: white;

  font-weight: 650;
  font-size: 16px;

  box-shadow:
    0 9px 25px rgba(79,124,255,.25);
}

#launchBtn:hover {
  background: var(--primary-hover);
}


/* ---------- COPYRIGHT ---------- */

.copyright {
  text-align: center;

  margin: 22px 0 10px;

  color: #65738a;

  font-size: 12px;
}


/* =========================================================
   ÉCRAN DE LECTURE
========================================================= */

#readerScreen {
  display: none;

  position: fixed;
  inset: 0;

  background: #030508;

  overflow: hidden;
}


/* =========================================================
   BARRE DE COMMANDES
========================================================= */

#readerToolbar {
  position: absolute;

  top: 0;
  left: 0;
  right: 0;

  height: 58px;

  z-index: 100;

  display: flex;
  align-items: center;

  gap: 7px;

  padding: 7px 12px;

  background:
    rgba(12,17,27,.96);

  border-bottom:
    1px solid rgba(255,255,255,.07);

  backdrop-filter: blur(10px);
}

.toolbarTitle {
  font-weight: 650;
  font-size: 15px;

  margin-right: auto;

  white-space: nowrap;
}

.toolbarButton {
  height: 38px;

  padding: 0 12px;

  border-radius: 9px;

  background: #1b2535;

  color: #dce4f0;

  font-size: 13px;
}

.toolbarButton:hover {
  background: #263349;
}

#pauseBtn {
  background: #49351d;
  color: #ffc96e;
}

#resetBtn {
  background: #47252a;
  color: #ff9da2;
}

#editBtn {
  background: #203458;
  color: #a9c3ff;
}


/* =========================================================
   TAILLE DU TEXTE
========================================================= */

.fontControl {
  display: flex;
  align-items: center;

  height: 38px;

  background: #151e2c;

  border-radius: 9px;

  overflow: hidden;
}

.fontButton {
  width: 42px;
  height: 38px;

  background: transparent;

  color: #e7edf7;

  font-weight: 650;
}

.fontButton:hover {
  background: #263349;
}

#fontLabel {
  min-width: 42px;

  text-align: center;

  color: #aeb9ca;

  font-size: 12px;
}


/* =========================================================
   ÉTAT MICRO
========================================================= */

#status {
  position: absolute;

  top: 70px;
  left: 50%;

  transform:
    translateX(-50%);

  z-index: 50;

  display: flex;
  align-items: center;

  gap: 7px;

  padding: 6px 12px;

  border-radius: 20px;

  background:
    rgba(14,20,31,.88);

  border:
    1px solid rgba(255,255,255,.08);

  color: #aeb9ca;

  font-size: 12px;

  pointer-events: none;
}

.statusDot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #7b8799;
}

#status.listening {
  color: #9ae6bd;
}

#status.listening .statusDot {
  background: var(--green);

  box-shadow:
    0 0 9px rgba(47,199,122,.7);
}


/* =========================================================
   PROMPTEUR
========================================================= */

#prompter {
  position: absolute;

  top: 58px;
  left: 0;
  right: 0;
  bottom: 0;

  overflow-y: auto;

  scrollbar-width: none;

  overscroll-behavior: none;
}

#prompter::-webkit-scrollbar {
  display: none;
}

#text {
  max-width: 1120px;

  margin: 0 auto;

  padding:
    35vh
    6%
    55vh;

  font-size: 46px;

  line-height: 1.52;

  text-align: center;

  overflow-wrap: break-word;

  letter-spacing: .1px;
}

.word {
  display: inline;

  color: #edf2f7;

  transition:
    color .16s;
}

.word.read {
  color: var(--read);
}

.word.current {
  color: var(--current);

  text-shadow:
    0 0 15px rgba(255,216,77,.12);
}


/* =========================================================
   LIGNE DE FOCUS TRÈS DISCRÈTE
========================================================= */

#focusGuide {
  position: absolute;

  z-index: 5;

  left: 8%;
  right: 8%;

  top: 43%;

  height: 1px;

  pointer-events: none;

  background:
    linear-gradient(
      90deg,
      transparent,
      rgba(255,255,255,.055),
      transparent
    );
}


/* =========================================================
   COMPTE À REBOURS
========================================================= */

#countdown {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 1000;

  place-items: center;

  background:
    rgba(3,5,8,.94);

  font-size:
    clamp(100px, 22vw, 220px);

  font-weight: 750;

  color: white;
}

#countdown.show {
  display: grid;
}

#countNumber {
  animation:
    countPulse .65s ease;
}

@keyframes countPulse {

  0% {
    transform: scale(.75);
    opacity: 0;
  }

  35% {
    transform: scale(1);
    opacity: 1;
  }

  100% {
    transform: scale(.94);
    opacity: .85;
  }
}


/* =========================================================
   RESPONSIVE TABLETTE
========================================================= */

@media (max-width: 800px) {

  #editorScreen {
    padding:
      22px 14px;
  }

  .brand {
    margin-bottom: 20px;
  }

  .brandIcon {
    width: 58px;
    height: 58px;

    border-radius: 18px;

    font-size: 28px;
  }

  .brand h1 {
    font-size: 30px;
  }

  .editorCard {
    padding: 15px;
  }

  #inputText {
    min-height: 280px;

    font-size: 16px;
  }

  #readerToolbar {
    height: 52px;

    padding:
      6px 7px;

    gap: 4px;
  }

  .toolbarTitle {
    font-size: 13px;
  }

  .toolbarButton {
    height: 36px;

    padding:
      0 9px;

    font-size: 12px;
  }

  .fontControl,
  .fontButton {
    height: 36px;
  }

  #prompter {
    top: 52px;
  }

  #status {
    top: 62px;
  }

  #text {
    font-size: 30px;

    padding-left: 4%;
    padding-right: 4%;
  }
}


/* =========================================================
   RESPONSIVE TÉLÉPHONE
========================================================= */

@media (max-width: 560px) {

  #editorScreen {
    padding:
      15px 10px;
  }

  .brand {
    margin:
      3px 0 15px;
  }

  .brandIcon {
    width: 48px;
    height: 48px;

    border-radius: 15px;

    font-size: 23px;

    margin-bottom: 8px;
  }

  .brand h1 {
    font-size: 26px;
  }

  .brand p {
    font-size: 13px;
  }

  .editorCard {
    border-radius: 15px;

    padding: 11px;
  }

  .editorTitle span {
    display: none;
  }

  #inputText {
    min-height: 250px;

    font-size: 15px;

    padding: 13px;
  }

  .editorFooter {
    flex-direction: column;

    align-items: stretch;
  }

  .hint {
    text-align: center;
  }

  #launchBtn {
    width: 100%;
  }


  /* BARRE MOBILE */

  #readerToolbar {
    justify-content: center;
  }

  .toolbarTitle {
    display: none;
  }

  .toolbarButton {
    padding:
      0 7px;

    font-size: 11px;
  }

  .fontButton {
    width: 34px;
  }

  #fontLabel {
    display: none;
  }

  #fullscreenBtn {
    width: 36px;

    padding: 0;
  }

  #text {
    font-size: 24px;

    line-height: 1.45;

    padding-left: 3.5%;
    padding-right: 3.5%;
  }

  #status {
    font-size: 10px;

    padding:
      5px 9px;
  }
}

</style>

<body>


<!-- =======================================================
     ÉCRAN DE PRÉPARATION
======================================================= -->

<section id="editorScreen">

  <div class="app">

    <div class="brand">

      <div class="brandIcon">
        🎙️
      </div>

      <h1>Prompteur vocal</h1>

      <p>
        Votre texte suit naturellement votre voix.
      </p>

    </div>


    <div class="editorCard">

      <div class="editorTitle">

        <strong>
          Votre texte
        </strong>

        <span id="wordCount">
          0 mot
        </span>

      </div>


      <textarea
        id="inputText"
        placeholder="Collez ou écrivez ici le texte à lire..."
      ></textarea>


      <div class="editorFooter">

        <div class="hint">
          Le défilement démarre avec votre voix,
          s'arrête lorsque vous faites une pause
          et reprend automatiquement.
        </div>


        <button id="launchBtn">
          🎙️ Lancer le prompteur
        </button>

      </div>

    </div>


    <div class="copyright">
      © 2026 C. Declerck — Tous droits réservés.
    </div>

  </div>

</section>



<!-- =======================================================
     ÉCRAN DE LECTURE
======================================================= -->

<section id="readerScreen">


  <div id="readerToolbar">

    <div class="toolbarTitle">
      Prompteur vocal
    </div>


    <button
      id="pauseBtn"
      class="toolbarButton"
    >
      ⏸ Pause
    </button>


    <button
      id="resetBtn"
      class="toolbarButton"
    >
      ↩ Début
    </button>


    <button
      id="editBtn"
      class="toolbarButton"
    >
      ✏️ Modifier
    </button>


    <div class="fontControl">

      <button
        id="fontMinus"
        class="fontButton"
        title="Réduire le texte"
      >
        A−
      </button>

      <span id="fontLabel">
        46
      </span>

      <button
        id="fontPlus"
        class="fontButton"
        title="Agrandir le texte"
      >
        A+
      </button>

    </div>


    <button
      id="fullscreenBtn"
      class="toolbarButton"
      title="Plein écran"
    >
      ⛶
    </button>

  </div>


  <div id="status">

    <span class="statusDot"></span>

    <span id="statusText">
      Prêt
    </span>

  </div>


  <div id="focusGuide"></div>


  <div id="prompter">

    <div id="text"></div>

  </div>

</section>



<!-- =======================================================
     COMPTE À REBOURS
======================================================= -->

<div id="countdown">

  <div id="countNumber">
    3
  </div>

</div>



<script>

/* =========================================================
   ÉLÉMENTS
========================================================= */

const editorScreen =
  document.getElementById("editorScreen");

const readerScreen =
  document.getElementById("readerScreen");

const inputText =
  document.getElementById("inputText");

const wordCount =
  document.getElementById("wordCount");

const launchBtn =
  document.getElementById("launchBtn");

const text =
  document.getElementById("text");

const prompter =
  document.getElementById("prompter");

const statusBox =
  document.getElementById("status");

const statusText =
  document.getElementById("statusText");

const pauseBtn =
  document.getElementById("pauseBtn");

const resetBtn =
  document.getElementById("resetBtn");

const editBtn =
  document.getElementById("editBtn");

const fullscreenBtn =
  document.getElementById("fullscreenBtn");

const fontMinus =
  document.getElementById("fontMinus");

const fontPlus =
  document.getElementById("fontPlus");

const fontLabel =
  document.getElementById("fontLabel");

const countdown =
  document.getElementById("countdown");

const countNumber =
  document.getElementById("countNumber");


/* =========================================================
   VARIABLES
========================================================= */

let words = [];
let currentWord = 0;

let recognition = null;
let listening = false;

let voiceActive = false;

let lastVoiceActivity = 0;

let animationFrame = null;
let previousFrameTime = 0;

let targetScrollSpeed = 0;
let currentScrollSpeed = 0;

let estimatedReadingSpeed = 24;

let previousTrackedWord = 0;
let previousTrackedTime = 0;

let currentFontSize = 46;

let countdownRunning = false;


/* =========================================================
   PARAMÈTRES DU MOTEUR HYBRIDE
========================================================= */

const SILENCE_DELAY = 950;

const SPEED_SMOOTHING = 0.055;

const MAX_CORRECTION_PER_FRAME = 1.2;


/* =========================================================
   COMPTEUR DE MOTS
========================================================= */

function updateWordCount() {

  const value =
    inputText.value.trim();

  const total =
    value
      ? value.split(/\s+/).length
      : 0;

  wordCount.textContent =
    total +
    (total > 1 ? " mots" : " mot");
}

inputText.addEventListener(
  "input",
  updateWordCount
);


/* =========================================================
   NORMALISATION
========================================================= */

function normalizeWord(value) {

  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^\p{L}\p{N}]/gu,
      ""
    );
}


/* =========================================================
   CONSTRUCTION DU TEXTE
========================================================= */

function buildText() {

  const content =
    inputText.value.trim();

  if (!content) {
    return false;
  }

  text.innerHTML = "";

  const rawWords =
    content.split(/\s+/);

  words =
    rawWords.map(
      (rawWord, index) => {

        const span =
          document.createElement(
            "span"
          );

        span.className =
          "word";

        span.dataset.index =
          index;

        span.textContent =
          rawWord + " ";

        text.appendChild(
          span
        );

        return {
          original:
            rawWord,

          normalized:
            normalizeWord(
              rawWord
            ),

          element:
            span
        };
      }
    );

  currentWord = 0;

  previousTrackedWord = 0;

  previousTrackedTime =
    performance.now();

  targetScrollSpeed = 0;
  currentScrollSpeed = 0;

  updateDisplay(true);

  return true;
}


/* =========================================================
   AFFICHAGE
========================================================= */

function updateDisplay(
  forcePosition = false
) {

  if (!words.length) {
    return;
  }

  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const element =
      words[i].element;

    element.classList.remove(
      "read",
      "current"
    );

    if (
      i < currentWord
    ) {
      element.classList.add(
        "read"
      );
    }

    if (
      i === currentWord
    ) {
      element.classList.add(
        "current"
      );
    }
  }

  if (forcePosition) {
    positionImmediately();
  }
}


/* =========================================================
   POSITION
========================================================= */

function positionImmediately() {

  const item =
    words[currentWord];

  if (!item) {
    return;
  }

  const desired =
    prompter.clientHeight *
    0.43;

  const target =
    Math.max(
      0,
      item.element.offsetTop -
      desired
    );

  prompter.scrollTop =
    target;
}


/* =========================================================
   ESTIMATION DU RYTHME
========================================================= */

function updateReadingSpeed() {

  const now =
    performance.now();

  const elapsed =
    now -
    previousTrackedTime;

  const wordDifference =
    currentWord -
    previousTrackedWord;


  if (
    wordDifference >= 2 &&
    elapsed >= 250
  ) {

    const wordsPerSecond =
      wordDifference /
      (elapsed / 1000);


    if (
      wordsPerSecond > 0.7 &&
      wordsPerSecond < 6
    ) {

      const calculatedSpeed =
        wordsPerSecond * 13;

      estimatedReadingSpeed =
        estimatedReadingSpeed *
        0.75 +
        calculatedSpeed *
        0.25;
    }


    previousTrackedWord =
      currentWord;

    previousTrackedTime =
      now;
  }
}


/* =========================================================
   ACTIVITÉ VOCALE
========================================================= */

function markVoiceActivity() {

  voiceActive = true;

  lastVoiceActivity =
    performance.now();

  targetScrollSpeed =
    estimatedReadingSpeed;
}


/* =========================================================
   BOUCLE DE DÉFILEMENT HYBRIDE
========================================================= */

function hybridScrollLoop(time) {

  if (!previousFrameTime) {
    previousFrameTime = time;
  }

  const delta =
    Math.min(
      50,
      time -
      previousFrameTime
    );

  previousFrameTime =
    time;


  if (listening) {

    const silenceDuration =
      performance.now() -
      lastVoiceActivity;


    if (
      silenceDuration >
      SILENCE_DELAY
    ) {

      voiceActive = false;

      targetScrollSpeed = 0;
    }


    currentScrollSpeed +=
      (
        targetScrollSpeed -
        currentScrollSpeed
      ) *
      SPEED_SMOOTHING;


    if (
      !voiceActive &&
      Math.abs(
        currentScrollSpeed
      ) < 0.15
    ) {

      currentScrollSpeed = 0;
    }


    const movement =
      currentScrollSpeed *
      (delta / 1000);

    prompter.scrollTop +=
      movement;


    /* ---------- RECALAGE DOUX ---------- */

    const item =
      words[currentWord];

    if (item) {

      const desiredPosition =
        prompter.clientHeight *
        0.43;

      const actualPosition =
        item.element.offsetTop -
        prompter.scrollTop;

      const difference =
        actualPosition -
        desiredPosition;

      const deadZone =
        prompter.clientHeight *
        0.12;


      if (
        Math.abs(difference) >
        deadZone
      ) {

        let correction =
          difference *
          0.012;

        correction =
          Math.max(
            -MAX_CORRECTION_PER_FRAME,
            Math.min(
              MAX_CORRECTION_PER_FRAME,
              correction
            )
          );

        prompter.scrollTop +=
          correction;
      }
    }
  }


  animationFrame =
    requestAnimationFrame(
      hybridScrollLoop
    );
}


/* =========================================================
   RECHERCHE DE POSITION
========================================================= */

function findBestPosition(
  spokenWords
) {

  if (
    !spokenWords.length ||
    !words.length
  ) {
    return null;
  }


  const recentSpoken =
    spokenWords.slice(-6);


  /* ---------- RECHERCHE LOCALE ---------- */

  const localStart =
    Math.max(
      0,
      currentWord - 4
    );

  const localEnd =
    Math.min(
      words.length - 1,
      currentWord + 8
    );

  let bestPosition = null;
  let bestScore = 0;


  for (
    let candidate =
      localStart;

    candidate <=
      localEnd;

    candidate++
  ) {

    let score = 0;


    for (
      let offset = 0;

      offset <
        recentSpoken.length;

      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];

      const textIndex =
        candidate -
        offset;


      if (
        textIndex < 0
      ) {
        continue;
      }


      if (
        words[textIndex] &&
        words[textIndex]
          .normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score > bestScore &&
      (
        score >= 2 ||
        (
          currentWord < 3 &&
          score >= 1
        )
      )
    ) {

      bestScore =
        score;

      bestPosition =
        candidate;
    }
  }


  if (
    bestPosition !== null
  ) {

    return {
      position:
        bestPosition,

      jump:
        false
    };
  }


  /* ---------- RATTRAPAGE ---------- */

  const recoveryStart =
    currentWord + 9;

  const recoveryEnd =
    Math.min(
      words.length - 1,
      currentWord + 60
    );

  let recoveryPosition =
    null;

  let recoveryScore = 0;


  for (
    let candidate =
      recoveryStart;

    candidate <=
      recoveryEnd;

    candidate++
  ) {

    let score = 0;


    for (
      let offset = 0;

      offset <
        recentSpoken.length;

      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];

      const textIndex =
        candidate -
        offset;


      if (
        textIndex <
        recoveryStart
      ) {
        continue;
      }


      if (
        words[textIndex] &&
        words[textIndex]
          .normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score >= 3 &&
      score >
        recoveryScore
    ) {

      recoveryScore =
        score;

      recoveryPosition =
        candidate;
    }
  }


  if (
    recoveryPosition !==
    null
  ) {

    return {
      position:
        recoveryPosition,

      jump:
        true
    };
  }


  return null;
}


/* =========================================================
   RECONNAISSANCE VOCALE
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart =
    () => {

      listening = true;

      voiceActive = false;

      lastVoiceActivity =
        performance.now();

      targetScrollSpeed = 0;

      statusText.textContent =
        "Écoute en cours";

      statusBox.classList.add(
        "listening"
      );

      pauseBtn.textContent =
        "⏸ Pause";
    };


  recognition.onresult =
    event => {

      let transcript = "";


      for (
        let i =
          event.resultIndex;

        i <
          event.results.length;

        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript +
          " ";
      }


      const spokenWords =
        transcript
          .trim()
          .split(/\s+/)
          .map(
            normalizeWord
          )
          .filter(
            Boolean
          );


      if (
        !spokenWords.length
      ) {
        return;
      }


      markVoiceActivity();


      const match =
        findBestPosition(
          spokenWords
        );


      if (
        match === null
      ) {
        return;
      }


      let newPosition;


      if (match.jump) {

        newPosition =
          match.position +
          1;

      }

      else {

        const maximumAdvance =
          4;

        newPosition =
          Math.min(
            match.position +
            1,

            currentWord +
            maximumAdvance
          );


        newPosition =
          Math.max(
            currentWord -
            2,

            newPosition
          );
      }


      newPosition =
        Math.max(
          0,

          Math.min(
            words.length -
            1,

            newPosition
          )
        );


      if (
        newPosition !==
        currentWord
      ) {

        currentWord =
          newPosition;

        updateReadingSpeed();

        updateDisplay(false);


        if (match.jump) {

          currentScrollSpeed =
            Math.max(
              currentScrollSpeed,
              estimatedReadingSpeed
            );
        }
      }
    };


  recognition.onerror =
    event => {

      if (
        event.error ===
        "no-speech"
      ) {
        return;
      }


      statusText.textContent =
        "Micro : " +
        event.error;
    };


  recognition.onend =
    () => {

      if (listening) {

        /*
          On espace volontairement
          les redémarrages pour les
          appareils Android plus anciens.
        */

        setTimeout(
          () => {

            if (!listening) {
              return;
            }

            try {
              recognition.start();
            }

            catch (e) {}

          },
          700
        );
      }

      else {

        voiceActive = false;

        targetScrollSpeed = 0;

        statusText.textContent =
          "En pause";

        statusBox.classList.remove(
          "listening"
        );

        pauseBtn.textContent =
          "▶ Reprendre";
      }
    };
}


/* =========================================================
   DÉMARRAGE RÉEL DU MICRO
========================================================= */

function startRecognition() {

  if (!SpeechRecognition) {

    alert(
      "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
    );

    return;
  }


  listening = true;

  voiceActive = false;

  targetScrollSpeed = 0;

  previousTrackedWord =
    currentWord;

  previousTrackedTime =
    performance.now();


  try {
    recognition.start();
  }

  catch (e) {}
}


/* =========================================================
   COMPTE À REBOURS
========================================================= */

async function runCountdown() {

  if (countdownRunning) {
    return;
  }

  countdownRunning = true;

  countdown.classList.add(
    "show"
  );


  for (
    const number of
    ["3", "2", "1"]
  ) {

    countNumber.textContent =
      number;

    countNumber.style.animation =
      "none";

    void countNumber.offsetWidth;

    countNumber.style.animation =
      "countPulse .65s ease";


    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          750
        )
    );
  }


  countdown.classList.remove(
    "show"
  );

  countdownRunning = false;

  startRecognition();
}


/* =========================================================
   LANCER LE PROMPTEUR
========================================================= */

launchBtn.addEventListener(
  "click",
  () => {

    if (
      !SpeechRecognition
    ) {

      alert(
        "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
      );

      return;
    }


    if (!buildText()) {

      alert(
        "Écrivez ou collez d'abord un texte."
      );

      return;
    }


    editorScreen.style.display =
      "none";

    readerScreen.style.display =
      "block";


    /*
      On attend que l'écran soit
      réellement affiché avant
      de calculer sa position.
    */

    requestAnimationFrame(
      () => {

        prompter.scrollTop = 0;

        updateDisplay(true);

        runCountdown();
      }
    );
  }
);


/* =========================================================
   PAUSE / REPRISE
========================================================= */

pauseBtn.addEventListener(
  "click",
  () => {

    if (listening) {

      listening = false;

      voiceActive = false;

      targetScrollSpeed = 0;


      if (recognition) {

        try {
          recognition.stop();
        }

        catch (e) {}
      }


      statusText.textContent =
        "En pause";

      statusBox.classList.remove(
        "listening"
      );

      pauseBtn.textContent =
        "▶ Reprendre";

    }

    else {

      startRecognition();

      pauseBtn.textContent =
        "⏸ Pause";
    }
  }
);


/* =========================================================
   RETOUR AU DÉBUT
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    currentWord = 0;

    previousTrackedWord = 0;

    previousTrackedTime =
      performance.now();

    targetScrollSpeed = 0;

    currentScrollSpeed = 0;

    prompter.scrollTop = 0;

    updateDisplay(true);

    statusText.textContent =
      listening
      ? "Écoute en cours"
      : "Au début";
  }
);


/* =========================================================
   MODIFIER
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    listening = false;

    voiceActive = false;

    targetScrollSpeed = 0;

    currentScrollSpeed = 0;


    if (recognition) {

      try {
        recognition.stop();
      }

      catch (e) {}
    }


    readerScreen.style.display =
      "none";

    editorScreen.style.display =
      "block";
  }
);


/* =========================================================
   TAILLE DU TEXTE
========================================================= */

function applyFontSize() {

  currentFontSize =
    Math.max(
      20,
      Math.min(
        70,
        currentFontSize
      )
    );


  text.style.fontSize =
    currentFontSize +
    "px";


  fontLabel.textContent =
    currentFontSize;
}


fontMinus.addEventListener(
  "click",
  () => {

    currentFontSize -= 2;

    applyFontSize();
  }
);


fontPlus.addEventListener(
  "click",
  () => {

    currentFontSize += 2;

    applyFontSize();
  }
);


/* =========================================================
   PLEIN ÉCRAN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async () => {

    try {

      if (
        !document.fullscreenElement
      ) {

        await document
          .documentElement
          .requestFullscreen();

      }

      else {

        await document
          .exitFullscreen();
      }

    }

    catch (e) {

      /*
        Certains navigateurs mobiles
        ne permettent pas le plein écran.
        Ce n'est pas bloquant.
      */
    }
  }
);


/* =========================================================
   BOUCLE DU MOTEUR
========================================================= */

animationFrame =
  requestAnimationFrame(
    hybridScrollLoop
  );


/* =========================================================
   INITIALISATION
========================================================= */

updateWordCount();
applyFontSize();

</script>

</body>
</html>
