<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompteur Radio ISTJ</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  overflow: hidden;
}

/* ---------- BARRE SUPÉRIEURE ---------- */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  min-height: 62px;
  z-index: 100;
  background: #1f2937;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px;
  flex-wrap: wrap;
}

header h1 {
  margin: 0 auto 0 0;
  font-size: 20px;
  white-space: nowrap;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 13px;
  font-size: 14px;
  cursor: pointer;
  color: white;
  white-space: nowrap;
}

#voiceBtn { background: #16a34a; }
#pauseBtn { background: #d97706; }
#resetBtn { background: #dc2626; }
#editBtn { background: #2563eb; }

.control {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
}

input[type="range"] {
  width: 90px;
}

/* ---------- ÉDITEUR ---------- */

#editorScreen {
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #f3f4f6;
  padding: 18px;
  overflow: auto;
}

#editorScreen h2 {
  margin: 0 0 10px;
  color: #111827;
}

#inputText {
  width: 100%;
  height: calc(100vh - 190px);
  min-height: 300px;
  padding: 18px;
  font-size: 18px;
  line-height: 1.5;
  border: 1px solid #bbb;
  border-radius: 10px;
  resize: none;
}

#editorHelp {
  color: #4b5563;
  margin: 8px 0 0;
  font-size: 14px;
}

/* ---------- ÉCRAN PROMPTEUR ---------- */

#readerScreen {
  display: none;
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #05070b;
  overflow: hidden;
}

#status {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(31,41,55,.85);
  color: #d1d5db;
  font-size: 13px;
  white-space: nowrap;
}

#status.listening {
  color: #86efac;
}

#prompter {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  scrollbar-width: none;
  overscroll-behavior: none;
}

#prompter::-webkit-scrollbar {
  display: none;
}

#text {
  max-width: 1100px;
  margin: 0 auto;
  padding: 36vh 6% 55vh;
  font-size: 46px;
  line-height: 1.55;
  text-align: center;
  overflow-wrap: break-word;
}

.word {
  display: inline;
  color: #f8fafc;
}

.word.read {
  color: #64748b;
}

.word.current {
  color: #facc15;
}

/* ---------- MOBILE / TABLETTE ---------- */

@media (max-width: 800px) {

  header {
    min-height: 54px;
    padding: 6px 8px;
    gap: 5px;
  }

  header h1 {
    font-size: 16px;
  }

  button {
    padding: 7px 9px;
    font-size: 12px;
  }

  .control {
    font-size: 11px;
  }

  input[type="range"] {
    width: 65px;
  }

  #editorScreen,
  #readerScreen {
    top: 54px;
  }

  #text {
    font-size: 30px;
    line-height: 1.48;
    padding-left: 4%;
    padding-right: 4%;
  }

  #status {
    font-size: 11px;
  }
}

@media (max-width: 520px) {

  header h1 {
    display: none;
  }

  header {
    justify-content: center;
  }

  #text {
    font-size: 27px;
  }
}
</style>
</head>

<body>

<header>

<h1>🎙️ Radio ISTJ</h1>

<button id="voiceBtn">🎤 Suivi vocal</button>
<button id="pauseBtn">⏸ Pause</button>
<button id="resetBtn">↩ Début</button>
<button id="editBtn">✏️ Modifier</button>

<div class="control">
  Taille
  <input id="fontSize" type="range" min="22" max="70" value="46">
</div>

</header>


<!-- ÉCRAN DE SAISIE -->

<div id="editorScreen">

  <h2>Préparer la chronique</h2>

  <textarea
    id="inputText"
    placeholder="Collez ici le texte de votre chronique..."
  ></textarea>

  <p id="editorHelp">
    Une fois le texte prêt, cliquez sur « Suivi vocal ».
  </p>

</div>


<!-- ÉCRAN DE LECTURE -->

<div id="readerScreen">

  <div id="status">
    Prêt
  </div>

  <div id="prompter">
    <div id="text"></div>
  </div>

</div>


<script>

/* =========================================================
   ÉLÉMENTS
========================================================= */

const editorScreen =
  document.getElementById("editorScreen");

const readerScreen =
  document.getElementById("readerScreen");

const inputText =
  document.getElementById("inputText");

const text =
  document.getElementById("text");

const prompter =
  document.getElementById("prompter");

const statusBox =
  document.getElementById("status");

const voiceBtn =
  document.getElementById("voiceBtn");

const pauseBtn =
  document.getElementById("pauseBtn");

const resetBtn =
  document.getElementById("resetBtn");

const editBtn =
  document.getElementById("editBtn");

const fontSize =
  document.getElementById("fontSize");


/* =========================================================
   VARIABLES
========================================================= */

let words = [];
let currentWord = 0;

let recognition = null;
let listening = false;

let lastScrollWord = -1;


/* =========================================================
   NORMALISATION
========================================================= */

function normalizeWord(value) {

  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\p{L}\p{N}]/gu, "");

}


/* =========================================================
   CONSTRUCTION DU TEXTE
========================================================= */

function buildText() {

  const content = inputText.value.trim();

  if (!content) {
    return false;
  }

  text.innerHTML = "";

  const rawWords = content.split(/\s+/);

  words = rawWords.map((rawWord, index) => {

    const span = document.createElement("span");

    span.className = "word";
    span.dataset.index = index;
    span.textContent = rawWord + " ";

    text.appendChild(span);

    return {
      original: rawWord,
      normalized: normalizeWord(rawWord),
      element: span
    };

  });

  currentWord = 0;
  lastScrollWord = -1;

  updateDisplay(true);

  return true;
}


/* =========================================================
   AFFICHAGE
========================================================= */

function updateDisplay(forceScroll = false) {

  if (!words.length) return;

  /*
    On ne reconstruit jamais le texte.
    Cela évite les changements de ligne
    et les sauts visuels pendant la lecture.
  */

  for (let i = 0; i < words.length; i++) {

    const element = words[i].element;

    element.classList.remove("read", "current");

    if (i < currentWord) {
      element.classList.add("read");
    }

    if (i === currentWord) {
      element.classList.add("current");
    }
  }

  /*
    Le prompteur ne bouge pas à chaque mot.
  */

  if (
    forceScroll ||
    lastScrollWord < 0 ||
    currentWord - lastScrollWord >= 5
  ) {

    scrollToCurrentWord();

    lastScrollWord = currentWord;
  }
}


/* =========================================================
   DÉFILEMENT DOUX ET LIMITÉ
========================================================= */

function scrollToCurrentWord() {

  const item = words[currentWord];

  if (!item) return;

  const desiredPosition =
    prompter.clientHeight * 0.43;

  const wordPosition =
    item.element.offsetTop;

  let target =
    wordPosition - desiredPosition;

  target = Math.max(0, target);

  const currentScroll =
    prompter.scrollTop;

  const maximumJump =
    prompter.clientHeight * 0.28;

  if (target > currentScroll + maximumJump) {
    target = currentScroll + maximumJump;
  }

  if (target < currentScroll - maximumJump) {
    target = currentScroll - maximumJump;
  }

  prompter.scrollTo({
    top: target,
    behavior: "smooth"
  });
}


/* =========================================================
   RECHERCHE D'UNE POSITION
========================================================= */

function findBestPosition(spokenWords) {

  if (!spokenWords.length || !words.length) {
    return null;
  }

  const recentSpoken =
    spokenWords.slice(-6);


  /* =====================================================
     1. RECHERCHE NORMALE

     On cherche seulement près de la position actuelle.
     C'est le comportement prudent qui fonctionne bien.
  ===================================================== */

  const localStart =
    Math.max(0, currentWord - 4);

  const localEnd =
    Math.min(
      words.length - 1,
      currentWord + 8
    );

  let bestPosition = null;
  let bestScore = 0;


  for (
    let candidate = localStart;
    candidate <= localEnd;
    candidate++
  ) {

    let score = 0;

    for (
      let offset = 0;
      offset < recentSpoken.length;
      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length - 1 - offset
        ];

      const textIndex =
        candidate - offset;

      if (textIndex < 0) continue;

      if (
        words[textIndex] &&
        words[textIndex].normalized === spoken
      ) {
        score++;
      }
    }

    if (
      score > bestScore &&
      (
        score >= 2 ||
        (currentWord < 3 && score >= 1)
      )
    ) {

      bestScore = score;
      bestPosition = candidate;
    }
  }


  /*
    Si la recherche locale donne une bonne
    correspondance, on garde le fonctionnement normal.
  */

  if (bestPosition !== null) {

    return {
      position: bestPosition,
      jump: false
    };
  }


  /* =====================================================
     2. RATTRAPAGE INTELLIGENT

     Si rien ne correspond près de la position actuelle,
     l'élève a peut-être sauté une phrase.

     On cherche alors plus loin, mais on exige une
     correspondance beaucoup plus forte.
  ===================================================== */

  const recoveryStart =
    currentWord + 9;

  const recoveryEnd =
    Math.min(
      words.length - 1,
      currentWord + 60
    );

  let recoveryPosition = null;
  let recoveryScore = 0;


  for (
    let candidate = recoveryStart;
    candidate <= recoveryEnd;
    candidate++
  ) {

    let score = 0;

    for (
      let offset = 0;
      offset < recentSpoken.length;
      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length - 1 - offset
        ];

      const textIndex =
        candidate - offset;

      if (textIndex < recoveryStart) {
        continue;
      }

      if (
        words[textIndex] &&
        words[textIndex].normalized === spoken
      ) {
        score++;
      }
    }

    /*
      Trois correspondances minimum sont nécessaires
      pour accepter un grand saut.
    */

    if (
      score >= 3 &&
      score > recoveryScore
    ) {

      recoveryScore = score;
      recoveryPosition = candidate;
    }
  }


  if (recoveryPosition !== null) {

    return {
      position: recoveryPosition,
      jump: true
    };
  }


  return null;
}


/* =========================================================
   SPEECH RECOGNITION
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart = () => {

    listening = true;

    statusBox.textContent =
      "🎤 Écoute en cours";

    statusBox.classList.add(
      "listening"
    );

    voiceBtn.textContent =
      "🎤 Écoute";
  };


  recognition.onresult = event => {

    let transcript = "";

    /*
      On récupère uniquement la reconnaissance
      actuellement fournie par le navigateur.
    */

    for (
      let i = event.resultIndex;
      i < event.results.length;
      i++
    ) {

      transcript +=
        event.results[i][0].transcript + " ";
    }


    const spokenWords =
      transcript
        .trim()
        .split(/\s+/)
        .map(normalizeWord)
        .filter(Boolean);


    if (!spokenWords.length) {
      return;
    }


    const match =
      findBestPosition(spokenWords);


    if (match === null) {
      return;
    }


    let newPosition;


    /* ===================================================
       CAS 1 : SAUT DE PHRASE DÉTECTÉ
    =================================================== */

    if (match.jump) {

      /*
        Plusieurs mots correspondent nettement
        à un passage situé plus loin.

        On considère donc que l'élève a volontairement
        sauté une phrase ou un passage.
      */

      newPosition =
        match.position + 1;

    }


    /* ===================================================
       CAS 2 : LECTURE NORMALE
    =================================================== */

    else {

      /*
        On conserve la sécurité de la version
        précédente : le suivi ne peut pas bondir
        brutalement vers l'avant.
      */

      const maximumAdvance = 4;

      newPosition =
        Math.min(
          match.position + 1,
          currentWord + maximumAdvance
        );


      /*
        Petit retour arrière autorisé si l'élève
        reprend quelques mots.
      */

      newPosition =
        Math.max(
          currentWord - 2,
          newPosition
        );
    }


    newPosition =
      Math.max(
        0,
        Math.min(
          words.length - 1,
          newPosition
        )
      );


    if (newPosition !== currentWord) {

      currentWord =
        newPosition;


      /*
        Lors d'un véritable saut de phrase,
        on autorise le prompteur à rejoindre
        immédiatement la nouvelle zone.
      */

      if (match.jump) {
        lastScrollWord = -1;
      }


      updateDisplay(
        match.jump
      );
    }
  };


  recognition.onerror = event => {

    /*
      Une courte absence de parole n'est pas
      considérée comme une erreur.
    */

    if (event.error === "no-speech") {
      return;
    }

    statusBox.textContent =
      "Micro : " + event.error;
  };


  recognition.onend = () => {

    if (listening) {

      /*
        Chrome peut fermer automatiquement une
        session de reconnaissance.

        On la relance uniquement si l'utilisateur
        est toujours en mode lecture.
      */

      setTimeout(() => {

        if (!listening) {
          return;
        }

        try {
          recognition.start();
        }
        catch (e) {}

      }, 250);

    }

    else {

      statusBox.textContent =
        "⏸ Suivi arrêté";

      statusBox.classList.remove(
        "listening"
      );

      voiceBtn.textContent =
        "🎤 Suivi vocal";
    }
  };
}


/* =========================================================
   LANCER / ARRÊTER LE SUIVI VOCAL
========================================================= */

voiceBtn.addEventListener(
  "click",
  () => {

    if (!SpeechRecognition) {

      alert(
        "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
      );

      return;
    }


    /*
      Si on se trouve encore dans l'éditeur,
      on construit d'abord le prompteur.
    */

    if (
      editorScreen.style.display !== "none"
    ) {

      if (!buildText()) {

        alert(
          "Collez d'abord le texte de votre chronique."
        );

        return;
      }


      editorScreen.style.display =
        "none";

      readerScreen.style.display =
        "block";

      prompter.scrollTop =
        0;

      updateDisplay(true);
    }


    if (!listening) {

      listening = true;

      try {
        recognition.start();
      }
      catch (e) {}

    }

    else {

      listening = false;

      try {
        recognition.stop();
      }
      catch (e) {}
    }
  }
);


/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener(
  "click",
  () => {

    listening = false;

    if (recognition) {

      try {
        recognition.stop();
      }
      catch (e) {}
    }

    statusBox.textContent =
      "⏸ En pause";

    statusBox.classList.remove(
      "listening"
    );

    voiceBtn.textContent =
      "🎤 Suivi vocal";
  }
);


/* =========================================================
   RETOUR AU DÉBUT
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    currentWord = 0;
    lastScrollWord = -1;

    prompter.scrollTop = 0;

    updateDisplay(true);

    statusBox.textContent =
      "↩ Revenu au début";
  }
);


/* =========================================================
   MODIFIER LE TEXTE
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    listening = false;

    if (recognition) {

      try {
        recognition.stop();
      }
      catch (e) {}
    }

    readerScreen.style.display =
      "none";

    editorScreen.style.display =
      "block";

    voiceBtn.textContent =
      "🎤 Suivi vocal";
  }
);


/* =========================================================
   TAILLE DU TEXTE
========================================================= */

fontSize.addEventListener(
  "input",
  () => {

    text.style.fontSize =
      fontSize.value + "px";

    setTimeout(() => {
      scrollToCurrentWord();
    }, 50);
  }
);

</script>

</body>
</html>
