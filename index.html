<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompteur Radio ISTJ</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: Arial, sans-serif;
  background: #05070b;
  color: white;
  overflow: hidden;
}

/* =========================
   BARRE SUPÉRIEURE
========================= */

header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  min-height: 62px;
  z-index: 100;
  background: #1f2937;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 9px 14px;
  flex-wrap: wrap;
}

header h1 {
  margin: 0 auto 0 0;
  font-size: 20px;
  white-space: nowrap;
}

button {
  border: 0;
  border-radius: 8px;
  padding: 9px 13px;
  font-size: 14px;
  cursor: pointer;
  color: white;
  white-space: nowrap;
}

#voiceBtn { background: #16a34a; }
#pauseBtn { background: #d97706; }
#resetBtn { background: #dc2626; }
#editBtn { background: #2563eb; }

.control {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 13px;
}

input[type="range"] {
  width: 90px;
}

/* =========================
   ÉDITEUR
========================= */

#editorScreen {
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #f3f4f6;
  padding: 18px;
  overflow: auto;
}

#editorScreen h2 {
  margin: 0 0 10px;
  color: #111827;
}

#inputText {
  width: 100%;
  height: calc(100vh - 190px);
  min-height: 300px;
  padding: 18px;
  font-size: 18px;
  line-height: 1.5;
  border: 1px solid #bbb;
  border-radius: 10px;
  resize: none;
}

#editorHelp {
  color: #4b5563;
  margin: 8px 0 0;
  font-size: 14px;
}

/* =========================
   PROMPTEUR
========================= */

#readerScreen {
  display: none;
  position: absolute;
  top: 62px;
  left: 0;
  right: 0;
  bottom: 0;
  background: #05070b;
  overflow: hidden;
}

#status {
  position: absolute;
  top: 8px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 20;
  padding: 5px 12px;
  border-radius: 20px;
  background: rgba(31,41,55,.85);
  color: #d1d5db;
  font-size: 13px;
  white-space: nowrap;
}

#status.listening {
  color: #86efac;
}

#prompter {
  position: absolute;
  inset: 0;
  overflow-y: auto;
  scrollbar-width: none;
  overscroll-behavior: none;
}

#prompter::-webkit-scrollbar {
  display: none;
}

#text {
  max-width: 1100px;
  margin: 0 auto;
  padding: 36vh 6% 55vh;
  font-size: 46px;
  line-height: 1.55;
  text-align: center;
  overflow-wrap: break-word;
}

.word {
  display: inline;
  color: #f8fafc;
}

.word.read {
  color: #64748b;
}

.word.current {
  color: #facc15;
}

/* =========================
   TABLETTE
========================= */

@media (max-width: 800px) {

  header {
    min-height: 54px;
    padding: 6px 8px;
    gap: 5px;
  }

  header h1 {
    font-size: 16px;
  }

  button {
    padding: 7px 9px;
    font-size: 12px;
  }

  .control {
    font-size: 11px;
  }

  input[type="range"] {
    width: 65px;
  }

  #editorScreen,
  #readerScreen {
    top: 54px;
  }

  #text {
    font-size: 30px;
    line-height: 1.48;
    padding-left: 4%;
    padding-right: 4%;
  }

  #status {
    font-size: 11px;
  }
}

/* =========================
   TÉLÉPHONE
========================= */

@media (max-width: 520px) {

  header h1 {
    display: none;
  }

  header {
    justify-content: center;
  }

  #text {
    font-size: 24px;
    line-height: 1.45;
  }

  input[type="range"] {
    width: 55px;
  }
}
</style>
</head>

<body>

<header>

<h1>🎙️ Radio ISTJ</h1>

<button id="voiceBtn">🎤 Suivi vocal</button>
<button id="pauseBtn">⏸ Pause</button>
<button id="resetBtn">↩ Début</button>
<button id="editBtn">✏️ Modifier</button>

<div class="control">
  Taille
  <input
    id="fontSize"
    type="range"
    min="20"
    max="70"
    value="46"
  >
</div>

</header>


<!-- ÉDITEUR -->

<div id="editorScreen">

  <h2>Préparer la chronique</h2>

  <textarea
    id="inputText"
    placeholder="Collez ici le texte de votre chronique..."
  ></textarea>

  <p id="editorHelp">
    Une fois le texte prêt, cliquez sur « Suivi vocal ».
  </p>

</div>


<!-- LECTURE -->

<div id="readerScreen">

  <div id="status">
    Prêt
  </div>

  <div id="prompter">
    <div id="text"></div>
  </div>

</div>


<script>

/* =========================================================
   ÉLÉMENTS
========================================================= */

const editorScreen =
  document.getElementById("editorScreen");

const readerScreen =
  document.getElementById("readerScreen");

const inputText =
  document.getElementById("inputText");

const text =
  document.getElementById("text");

const prompter =
  document.getElementById("prompter");

const statusBox =
  document.getElementById("status");

const voiceBtn =
  document.getElementById("voiceBtn");

const pauseBtn =
  document.getElementById("pauseBtn");

const resetBtn =
  document.getElementById("resetBtn");

const editBtn =
  document.getElementById("editBtn");

const fontSize =
  document.getElementById("fontSize");


/* =========================================================
   VARIABLES
========================================================= */

let words = [];
let currentWord = 0;

let recognition = null;
let listening = false;

let lastScrollWord = -1;

/*
  MODE HYBRIDE
*/

let voiceActive = false;

let lastVoiceActivity = 0;

let animationFrame = null;
let previousFrameTime = 0;

/*
  Vitesse du mouvement en pixels / seconde.
  Elle va apprendre progressivement le rythme du lecteur.
*/

let targetScrollSpeed = 0;
let currentScrollSpeed = 0;

let estimatedReadingSpeed = 24;

/*
  Informations utilisées pour estimer
  le rythme réel de lecture.
*/

let previousTrackedWord = 0;
let previousTrackedTime = 0;


/* =========================================================
   PARAMÈTRES DU MODE HYBRIDE
========================================================= */

/*
  Temps de silence avant arrêt du défilement.
*/

const SILENCE_DELAY = 950;

/*
  Accélération / ralentissement progressifs.
*/

const SPEED_SMOOTHING = 0.055;

/*
  Correction maximale automatique vers le mot jaune.
  Très faible volontairement pour éviter les bonds.
*/

const MAX_CORRECTION_PER_FRAME = 1.2;


/* =========================================================
   NORMALISATION
========================================================= */

function normalizeWord(value) {

  return value
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\p{L}\p{N}]/gu, "");

}


/* =========================================================
   CONSTRUCTION DU TEXTE
========================================================= */

function buildText() {

  const content =
    inputText.value.trim();

  if (!content) {
    return false;
  }

  text.innerHTML = "";

  const rawWords =
    content.split(/\s+/);

  words = rawWords.map(
    (rawWord, index) => {

      const span =
        document.createElement("span");

      span.className = "word";
      span.dataset.index = index;
      span.textContent = rawWord + " ";

      text.appendChild(span);

      return {
        original: rawWord,
        normalized: normalizeWord(rawWord),
        element: span
      };

    }
  );

  currentWord = 0;
  lastScrollWord = -1;

  previousTrackedWord = 0;
  previousTrackedTime = performance.now();

  targetScrollSpeed = 0;
  currentScrollSpeed = 0;

  updateDisplay(true);

  return true;
}


/* =========================================================
   AFFICHAGE DES MOTS
========================================================= */

function updateDisplay(forceScroll = false) {

  if (!words.length) return;

  for (
    let i = 0;
    i < words.length;
    i++
  ) {

    const element =
      words[i].element;

    element.classList.remove(
      "read",
      "current"
    );

    if (i < currentWord) {
      element.classList.add("read");
    }

    if (i === currentWord) {
      element.classList.add("current");
    }
  }

  /*
    Le mot jaune ne commande plus directement
    chaque mouvement.

    Il sert d'ancre au défilement continu.
  */

  if (forceScroll) {
    positionImmediately();
  }
}


/* =========================================================
   POSITION INITIALE
========================================================= */

function positionImmediately() {

  const item =
    words[currentWord];

  if (!item) return;

  const desired =
    prompter.clientHeight * 0.43;

  const target =
    Math.max(
      0,
      item.element.offsetTop - desired
    );

  prompter.scrollTop = target;

  lastScrollWord = currentWord;
}


/* =========================================================
   ESTIMATION DU RYTHME DE LECTURE
========================================================= */

function updateReadingSpeed() {

  const now =
    performance.now();

  const elapsed =
    now - previousTrackedTime;

  const wordDifference =
    currentWord - previousTrackedWord;

  /*
    On n'actualise le rythme que si plusieurs mots
    ont réellement été parcourus.
  */

  if (
    wordDifference >= 2 &&
    elapsed >= 250
  ) {

    const wordsPerSecond =
      wordDifference /
      (elapsed / 1000);

    /*
      On évite les estimations absurdes dues
      à une reconnaissance momentanément mauvaise.
    */

    if (
      wordsPerSecond > 0.7 &&
      wordsPerSecond < 6
    ) {

      /*
        Conversion approximative en vitesse visuelle.
        La vitesse réelle sera ensuite corrigée
        doucement grâce à la position du mot jaune.
      */

      const calculatedSpeed =
        wordsPerSecond * 13;

      estimatedReadingSpeed =
        estimatedReadingSpeed * 0.75 +
        calculatedSpeed * 0.25;
    }

    previousTrackedWord =
      currentWord;

    previousTrackedTime =
      now;
  }
}


/* =========================================================
   DÉTECTION DE PAROLE
========================================================= */

function markVoiceActivity() {

  voiceActive = true;

  lastVoiceActivity =
    performance.now();

  /*
    Tant que la personne parle,
    le défilement vise la vitesse
    correspondant à son rythme.
  */

  targetScrollSpeed =
    estimatedReadingSpeed;
}


/* =========================================================
   BOUCLE DE DÉFILEMENT HYBRIDE
========================================================= */

function hybridScrollLoop(time) {

  if (!listening) {

    animationFrame =
      requestAnimationFrame(
        hybridScrollLoop
      );

    previousFrameTime = time;

    return;
  }


  if (!previousFrameTime) {
    previousFrameTime = time;
  }

  const delta =
    Math.min(
      50,
      time - previousFrameTime
    );

  previousFrameTime = time;


  /* =====================================================
     SILENCE
  ===================================================== */

  const silenceDuration =
    performance.now() -
    lastVoiceActivity;

  if (
    silenceDuration >
    SILENCE_DELAY
  ) {

    voiceActive = false;
    targetScrollSpeed = 0;
  }


  /* =====================================================
     ACCÉLÉRATION / RALENTISSEMENT PROGRESSIFS
  ===================================================== */

  currentScrollSpeed +=
    (
      targetScrollSpeed -
      currentScrollSpeed
    ) *
    SPEED_SMOOTHING;


  /*
    Si on est presque arrêté,
    on passe réellement à zéro.
  */

  if (
    !voiceActive &&
    Math.abs(currentScrollSpeed) < 0.15
  ) {

    currentScrollSpeed = 0;
  }


  /* =====================================================
     DÉFILEMENT CONTINU
  ===================================================== */

  const movement =
    currentScrollSpeed *
    (delta / 1000);

  prompter.scrollTop += movement;


  /* =====================================================
     CORRECTION DOUCE AVEC LE MOT JAUNE
  ===================================================== */

  const item =
    words[currentWord];

  if (item) {

    const desiredPosition =
      prompter.clientHeight * 0.43;

    const actualPosition =
      item.element.offsetTop -
      prompter.scrollTop;

    const difference =
      actualPosition -
      desiredPosition;


    /*
      Zone morte :
      tant que le mot jaune reste raisonnablement
      proche de sa position idéale, on ne corrige rien.
    */

    const deadZone =
      prompter.clientHeight * 0.12;


    if (
      Math.abs(difference) >
      deadZone
    ) {

      /*
        Correction très progressive.
        Aucun scrollTo brutal.
      */

      let correction =
        difference * 0.012;

      correction =
        Math.max(
          -MAX_CORRECTION_PER_FRAME,
          Math.min(
            MAX_CORRECTION_PER_FRAME,
            correction
          )
        );

      prompter.scrollTop +=
        correction;
    }
  }


  animationFrame =
    requestAnimationFrame(
      hybridScrollLoop
    );
}


/* =========================================================
   RECHERCHE DE POSITION
========================================================= */

function findBestPosition(
  spokenWords
) {

  if (
    !spokenWords.length ||
    !words.length
  ) {
    return null;
  }

  const recentSpoken =
    spokenWords.slice(-6);


  /* =====================================================
     1. RECHERCHE NORMALE
  ===================================================== */

  const localStart =
    Math.max(
      0,
      currentWord - 4
    );

  const localEnd =
    Math.min(
      words.length - 1,
      currentWord + 8
    );

  let bestPosition = null;
  let bestScore = 0;


  for (
    let candidate = localStart;
    candidate <= localEnd;
    candidate++
  ) {

    let score = 0;

    for (
      let offset = 0;
      offset < recentSpoken.length;
      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];

      const textIndex =
        candidate - offset;

      if (textIndex < 0) continue;

      if (
        words[textIndex] &&
        words[textIndex].normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score > bestScore &&
      (
        score >= 2 ||
        (
          currentWord < 3 &&
          score >= 1
        )
      )
    ) {

      bestScore = score;
      bestPosition = candidate;
    }
  }


  if (bestPosition !== null) {

    return {
      position: bestPosition,
      jump: false
    };
  }


  /* =====================================================
     2. RATTRAPAGE APRÈS SAUT DE PHRASE
  ===================================================== */

  const recoveryStart =
    currentWord + 9;

  const recoveryEnd =
    Math.min(
      words.length - 1,
      currentWord + 60
    );

  let recoveryPosition = null;
  let recoveryScore = 0;


  for (
    let candidate = recoveryStart;
    candidate <= recoveryEnd;
    candidate++
  ) {

    let score = 0;

    for (
      let offset = 0;
      offset < recentSpoken.length;
      offset++
    ) {

      const spoken =
        recentSpoken[
          recentSpoken.length -
          1 -
          offset
        ];

      const textIndex =
        candidate - offset;

      if (
        textIndex <
        recoveryStart
      ) {
        continue;
      }

      if (
        words[textIndex] &&
        words[textIndex].normalized ===
        spoken
      ) {

        score++;
      }
    }


    if (
      score >= 3 &&
      score > recoveryScore
    ) {

      recoveryScore = score;
      recoveryPosition = candidate;
    }
  }


  if (
    recoveryPosition !== null
  ) {

    return {
      position: recoveryPosition,
      jump: true
    };
  }


  return null;
}


/* =========================================================
   RECONNAISSANCE VOCALE
========================================================= */

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.lang =
    "fr-FR";

  recognition.continuous =
    true;

  recognition.interimResults =
    true;

  recognition.maxAlternatives =
    1;


  recognition.onstart = () => {

    listening = true;

    /*
      On ne fait pas encore défiler tant
      qu'aucune parole n'a été détectée.
    */

    voiceActive = false;

    lastVoiceActivity =
      performance.now();

    targetScrollSpeed = 0;

    statusBox.textContent =
      "🎤 Écoute en cours";

    statusBox.classList.add(
      "listening"
    );

    voiceBtn.textContent =
      "🎤 Écoute";
  };


  recognition.onresult =
    event => {

      let transcript = "";


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0]
            .transcript + " ";
      }


      const spokenWords =
        transcript
          .trim()
          .split(/\s+/)
          .map(normalizeWord)
          .filter(Boolean);


      if (!spokenWords.length) {
        return;
      }


      /*
        Dès que le moteur reçoit de la parole,
        le défilement peut fonctionner.
      */

      markVoiceActivity();


      const match =
        findBestPosition(
          spokenWords
        );


      if (match === null) {

        /*
          Même si le texte n'a pas encore été
          reconnu précisément, on sait que
          l'élève est en train de parler.

          Le défilement reste donc doux.
        */

        return;
      }


      let newPosition;


      /* =================================================
         SAUT DE PHRASE
      ================================================= */

      if (match.jump) {

        newPosition =
          match.position + 1;

      }


      /* =================================================
         LECTURE NORMALE
      ================================================= */

      else {

        const maximumAdvance = 4;

        newPosition =
          Math.min(
            match.position + 1,
            currentWord +
            maximumAdvance
          );

        newPosition =
          Math.max(
            currentWord - 2,
            newPosition
          );
      }


      newPosition =
        Math.max(
          0,
          Math.min(
            words.length - 1,
            newPosition
          )
        );


      if (
        newPosition !==
        currentWord
      ) {

        currentWord =
          newPosition;

        /*
          On apprend le débit réel.
        */

        updateReadingSpeed();

        /*
          On met à jour le jaune,
          sans déplacement brutal.
        */

        updateDisplay(false);


        /*
          En cas de saut de phrase,
          on ne téléporte toujours pas l'écran.

          On accélère simplement temporairement
          la correction vers la nouvelle position.
        */

        if (match.jump) {

          currentScrollSpeed =
            Math.max(
              currentScrollSpeed,
              estimatedReadingSpeed
            );
        }
      }
    };


  recognition.onerror =
    event => {

      if (
        event.error ===
        "no-speech"
      ) {

        return;
      }

      statusBox.textContent =
        "Micro : " +
        event.error;
    };


  recognition.onend = () => {

    if (listening) {

      /*
        Certains navigateurs mobiles ferment
        eux-mêmes la reconnaissance.

        On ne peut pas empêcher tous les sons
        système associés au micro.

        On évite cependant les relances
        extrêmement rapides.
      */

      setTimeout(() => {

        if (!listening) {
          return;
        }

        try {
          recognition.start();
        }
        catch (e) {}

      }, 700);

    }

    else {

      voiceActive = false;
      targetScrollSpeed = 0;

      statusBox.textContent =
        "⏸ Suivi arrêté";

      statusBox.classList.remove(
        "listening"
      );

      voiceBtn.textContent =
        "🎤 Suivi vocal";
    }
  };
}


/* =========================================================
   SUIVI VOCAL
========================================================= */

voiceBtn.addEventListener(
  "click",
  () => {

    if (!SpeechRecognition) {

      alert(
        "Le suivi vocal n'est pas disponible dans ce navigateur. Essayez Chrome ou Edge."
      );

      return;
    }


    if (
      editorScreen.style.display !==
      "none"
    ) {

      if (!buildText()) {

        alert(
          "Collez d'abord le texte de votre chronique."
        );

        return;
      }

      editorScreen.style.display =
        "none";

      readerScreen.style.display =
        "block";

      prompter.scrollTop = 0;

      updateDisplay(true);
    }


    if (!listening) {

      listening = true;

      voiceActive = false;
      targetScrollSpeed = 0;

      previousTrackedWord =
        currentWord;

      previousTrackedTime =
        performance.now();

      try {
        recognition.start();
      }
      catch (e) {}

    }

    else {

      listening = false;

      voiceActive = false;
      targetScrollSpeed = 0;

      try {
        recognition.stop();
      }
      catch (e) {}
    }
  }
);


/* =========================================================
   PAUSE
========================================================= */

pauseBtn.addEventListener(
  "click",
  () => {

    listening = false;

    voiceActive = false;
    targetScrollSpeed = 0;

    if (recognition) {

      try {
        recognition.stop();
      }
      catch (e) {}
    }

    statusBox.textContent =
      "⏸ En pause";

    statusBox.classList.remove(
      "listening"
    );

    voiceBtn.textContent =
      "🎤 Suivi vocal";
  }
);


/* =========================================================
   DÉBUT
========================================================= */

resetBtn.addEventListener(
  "click",
  () => {

    currentWord = 0;
    lastScrollWord = -1;

    previousTrackedWord = 0;
    previousTrackedTime =
      performance.now();

    targetScrollSpeed = 0;
    currentScrollSpeed = 0;

    prompter.scrollTop = 0;

    updateDisplay(true);

    statusBox.textContent =
      "↩ Revenu au début";
  }
);


/* =========================================================
   MODIFIER
========================================================= */

editBtn.addEventListener(
  "click",
  () => {

    listening = false;

    voiceActive = false;

    targetScrollSpeed = 0;
    currentScrollSpeed = 0;

    if (recognition) {

      try {
        recognition.stop();
      }
      catch (e) {}
    }

    readerScreen.style.display =
      "none";

    editorScreen.style.display =
      "block";

    voiceBtn.textContent =
      "🎤 Suivi vocal";
  }
);


/* =========================================================
   TAILLE
========================================================= */

fontSize.addEventListener(
  "input",
  () => {

    text.style.fontSize =
      fontSize.value + "px";

  }
);


/* =========================================================
   DÉMARRAGE DE LA BOUCLE FLUIDE
========================================================= */

animationFrame =
  requestAnimationFrame(
    hybridScrollLoop
  );

</script>

</body>
</html>
